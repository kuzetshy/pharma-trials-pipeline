# ==============================================================================
# PharmaInsight Multi-Container Compose Specification
# ==============================================================================
# Usage:
#   1. Run full stack (REST API + Streamlit Dashboard):
#      docker compose up --build -d
#   2. Run only REST API:
#      docker compose up --build -d api
#   3. Run only Dashboard:
#      docker compose up --build -d dashboard
#   4. Run ELT Data Pipeline on-demand:
#      docker compose run --rm pipeline
# ==============================================================================

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pharma-trials-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATA_DIR=/app/data
      - BRONZE_DIR=/app/data/bronze
      - SILVER_DIR=/app/data/silver
      - GOLD_DIR=/app/data/gold
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-gemini-1.5-flash}
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pharma-trials-dashboard
    restart: unless-stopped
    command: [
      "streamlit", "run", "src/dashboard/app.py",
      "--server.port=8501",
      "--server.address=0.0.0.0",
      "--server.headless=true",
      "--browser.serverAddress=localhost"
    ]
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pharma-trials-pipeline
    profiles:
      - tools
    command: ["python", "run_pipeline.py"]
    environment:
      - PYTHONUNBUFFERED=1
      - DATA_DIR=/app/data
      - BRONZE_DIR=/app/data/bronze
      - SILVER_DIR=/app/data/silver
      - GOLD_DIR=/app/data/gold
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - LLM_API_KEY=${LLM_API_KEY:-}
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data

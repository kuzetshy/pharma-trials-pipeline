name: CI Pipeline (Quality, Tests & Docker)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint and Static Analysis (Ruff)
        run: |
          ruff check .

      - name: Run Pytest Suite
        run: |
          pytest -v --durations=10 tests/

  docker-smoke-test:
    name: Docker Build & Health Smoke Test
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t pharma-trials-api:ci .

      - name: Run Container & Test Healthcheck
        run: |
          docker run -d --name test-api -p 8000:8000 -e LLM_PROVIDER=mock pharma-trials-api:ci
          sleep 5
          curl --fail --retry 3 --retry-delay 2 http://localhost:8000/health
          docker stop test-api
